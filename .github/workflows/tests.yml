name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 still has prebuilt interpreters for the oldest supported Python.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile the plug-in
        run: python -m py_compile subsplease.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
